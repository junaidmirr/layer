[package]
name = "layer"
version = "0.1.0"
edition = "2024"
description = "High-performance AST code intelligence and Model Context Protocol (MCP) server for AI coding agents"
license = "MIT"
readme = "README.md"
repository = "https://github.com/junaidmirr/layer"
keywords = ["mcp", "code-intelligence", "ast", "context-engine", "ai-agents"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
notify = "8.0"
notify-debouncer-mini = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
rustyline = "15.0"
colored = "3.0"
regex = "1.11"
walkdir = "2.5"
petgraph = { version = "0.7", features = ["serde-1"] }
tracing = "0.1"
tracing-subscriber = "0.3"
axum = { version = "0.8", optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }
tree-sitter = "0.25"
tree-sitter-rust = "0.24.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-cpp = "0.23.4"

[features]
default = []
server = ["dep:axum", "dep:tower-http"]

[dev-dependencies]
tempfile = "3.27"
